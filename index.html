<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo class exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Todo</h1>
        
        <!-- Input area -->
        <div class="input-area">
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button id="add-button">Add</button>
        </div>

        <!-- List -->
        <ul id="todo-list">
            <!-- Tasks are added here with JavaScript -->
        </ul>

        <!-- Remove last task -->
        <button id="remove-last-button">Remove last</button>

        <!-- Counter -->
        <p id="counter">Remaining: 0 | Total: 0</p><!-- Counter text is updated by JavaScript -->
    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
